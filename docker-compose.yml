version: "3.9"

services:
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - NOTIFICACIONES_SERVICE_URL=http://flask_notificaciones:5000
      - ENV_TYPE=MICROSERVICIO
    depends_on:
      - flask_notificaciones

  flask_notificaciones:
    build:
      context: ./notificaciones_service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - flask_notificaciones